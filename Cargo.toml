[package]
name = "fhir-toolbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["OctoFHIR Team"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/octofhir/fhir-toolbox"
homepage = "https://github.com/octofhir/fhir-toolbox"
description = "FHIR tools for agents, offline: find profiles and extensions, validate against an IG, evaluate FHIRPath, run views"
keywords = ["fhir", "mcp", "agents", "validation", "healthcare"]
categories = ["development-tools", "command-line-utilities"]
exclude = [".github/"]

[[bin]]
name = "fhir-toolbox"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The `fhir-toolbox` MCP server on stdio.
cli = ["dep:clap"]

[dependencies]
fhir-diff = { version = "0.1.2", default-features = false, features = ["registry"] }
octofhir-fhirpath = { version = "0.5.9", default-features = false }
octofhir-fhirschema = { version = "0.3.41", default-features = false }
octofhir-sof = "0.3.5"
clap = { version = "4.6", features = ["derive"], optional = true }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rmcp = { version = "3.9.0", features = ["server", "transport-io"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util"] }
