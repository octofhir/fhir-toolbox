name: Release

# Pushing a `vX.Y.Z` tag publishes the crate to crates.io and cuts a GitHub release with a
# binary per platform (each with a `.sha256`). Run it by hand with an existing `tag` to
# (re)build that release's binaries.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z) to build binaries for
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features
      - name: Tag matches the crate version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          test "v$version" = "$TAG" || { echo "::error::tag $TAG, crate $version"; exit 1; }

  crates-io:
    name: publish to crates.io
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${TAG#v}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "fhir-toolbox-release" \
            "https://crates.io/api/v1/crates/fhir-toolbox/$version")
          if [ "$code" = "200" ]; then
            echo "fhir-toolbox $version is already published"
            exit 0
          fi
          cargo publish --locked

  create-release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "$TAG" --generate-notes

  build:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: fhir-toolbox
          target: ${{ matrix.target }}
          archive: fhir-toolbox-$target
          checksum: sha256
          include: README.md,LICENSE-MIT,LICENSE-APACHE
          ref: refs/tags/${{ env.TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
